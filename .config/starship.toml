add_newline = true
command_timeout = 300
# Use custom worktree-aware directory display and conditional git info
format = "${custom.worktree_dir}${custom.git_info}$character"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"
style = "cyan"
repo_root_style = "cyan"
# For worktrees, this shows parent/worktree/subdirs structure
# When in ~/Work/84codes/lavinmq/main, shows: lavinmq/main
# When in ~/Work/84codes/lavinmq/main/src, shows: lavinmq/main/src
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
before_repo_root_style = "cyan"

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"
# Hide git branch in bare repos
disabled = false
only_attached = false

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[custom.worktree_dir]
command = "bash /home/anders/.config/starship-worktree-dir.sh"
when = "true"
format = "[$output ]($style)"
style = "cyan"

[custom.git_info]
command = "bash /home/anders/.config/starship-git-info.sh"
when = "true"
format = "[$output ]($style)"
style = "italic cyan"
