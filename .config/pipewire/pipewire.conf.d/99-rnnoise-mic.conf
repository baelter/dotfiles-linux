## RNNoise-filtered capture source. The Bose NC 700 mic does this in hardware,
## but its HFP/SCO link is unusable on the MT7925 adapter, so the C920 needs it in software.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Noise Suppressed Mic"
      media.name       = "Noise Suppressed Mic"
      filter.graph = {
        nodes = [
          {
            type   = lv2
            name   = rnnoise
            plugin = "https://github.com/werman/noise-suppression-for-voice#mono"
            control = { "enabled" = 1.0 }
          }
        ]
      }
      capture.props = {
        node.name    = "capture.rnnoise_source"
        node.passive = true
        audio.rate   = 48000
        target.object = "alsa_input.usb-046d_HD_Pro_Webcam_C920_4B91BCDF-02.analog-stereo"
      }
      playback.props = {
        node.name   = "rnnoise_source"
        media.class = Audio/Source
        audio.rate  = 48000
      }
    }
  }
]
