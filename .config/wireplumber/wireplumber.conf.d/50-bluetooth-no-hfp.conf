## HFP/HSP is unusable on this laptop's MT7925 adapter: the SCO link carries no
## audio and starves the radio, which duplicates Bluetooth keyboard keystrokes.
## Offering only A2DP means nothing can autoswitch the headset into SCO.
monitor.bluez.properties = {
  bluez5.roles         = [ a2dp_sink a2dp_source ]
  bluez5.enable-sbc-xq = true
}
