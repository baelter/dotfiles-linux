# alsa-ucm-conf 1.2.16 links acp-pdm-mach into another card's UCM, and ACP then
# fails to probe it with EEXIST, so the built-in mic array never reaches PipeWire.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*acp-pdm-mach" }
    ]
    actions = {
      update-props = {
        api.alsa.use-ucm = false
      }
    }
  }
]
